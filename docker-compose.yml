services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?imposta DB_ROOT_PASSWORD nel .env}
      MYSQL_DATABASE: ${DB_DATABASE:-prevo}
      MYSQL_USER: ${DB_USERNAME:-prevo}
      MYSQL_PASSWORD: ${DB_PASSWORD:?imposta DB_PASSWORD nel .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8080"
    environment: &laravel-env
      APP_NAME: Prevo
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:?genera APP_KEY, vedi .env.example}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-prevo}
      DB_USERNAME: ${DB_USERNAME:-prevo}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_DOMAIN: ${SESSION_DOMAIN:-localhost}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:3000}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
      # esegue le migrazioni all'avvio del container
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
    depends_on:
      db:
        condition: service_healthy

  queue:
    build:
      context: ./Backend
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    environment:
      <<: *laravel-env
      AUTORUN_ENABLED: "false"
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./front-end
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  db-data:
